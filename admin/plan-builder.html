<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Plan Builder</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../assets/css/theme.css"/></head>
<body data-state="diagnosed" class="text-slate-800">
<header class="border-b border-slate-200 bg-white"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between"><a class="font-semibold" href="dashboard.html">Clinical Admin</a><nav class="text-sm space-x-3"><a href="dashboard.html">Dashboard</a><a href="diagnosis.html">Diagnosis</a><a href="plan-builder.html" class="font-medium">Plan Builder</a><a href="kit-builder.html">Kit Builder</a><a href="monitoring.html">Monitoring</a></nav></div></header>
<main class="max-w-7xl mx-auto px-6 py-8">
<section class="card p-6 envi"><h1 class="text-xl font-semibold">Plan Builder</h1><p class="vi">Thiết lập phác đồ điều trị</p>
<form class="mt-4 grid md:grid-cols-2 gap-4 text-sm">
<label class="grid gap-1">Protocol Name / Tên phác đồ<input class="border rounded-lg px-3 py-2" placeholder="Recovery Protocol"/></label>
<label class="grid gap-1">Clinical Goal / Mục tiêu điều trị<input class="border rounded-lg px-3 py-2" placeholder="Reduce inflammation"/></label>
<label class="grid gap-1">Week 1–2 / Tuần 1–2<textarea class="border rounded-lg px-3 py-2" rows="3"></textarea></label>
<label class="grid gap-1">Week 3–6 / Tuần 3–6<textarea class="border rounded-lg px-3 py-2" rows="3"></textarea></label>
<label class="md:col-span-2 grid gap-1">Week 7–12 / Tuần 7–12<textarea class="border rounded-lg px-3 py-2" rows="3"></textarea></label>
<div class="md:col-span-2"><button class="px-4 py-2 rounded-lg bg-slate-900 text-white">Save Plan Template</button></div>
</form></section>
