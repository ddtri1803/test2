<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dermatology Guided Journey Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-6">
    <header class="mb-4">
      <h1 class="text-2xl font-semibold">Guided Treatment Journey</h1>
      <p class="text-sm text-slate-500">Hành trình điều trị có hướng dẫn</p>
    </header>

    <div class="bg-white border border-slate-200 rounded-xl p-4 mb-4 sticky top-2 z-10">
      <div class="flex items-center justify-between text-sm mb-2">
        <span>Progress</span>
        <span id="progressLabel">0 / 10</span>
      </div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-slate-900 transition-all duration-300" style="width:0%"></div>
      </div>
    </div>

    <main id="app" class="bg-white border border-slate-200 rounded-xl p-5 min-h-[420px]"></main>
  </div>

  <script>
    let step = 0;
    const state = {
      answers: {},
      weekOpened: {1:false,2:false,3:false},
      roleOpened: {cleanser:false,serum:false,moisturizer:false},
      warningShown: false,
      chatIndex: 0,
      chatDone: false,
      name: '',
      phone: ''
    };

    const quiz = [
      { key: 'concern', q: 'Main concern? / Vấn đề chính?', options: ['Acne / Mụn', 'Dark Spots / Nám thâm', 'Sensitive / Nhạy cảm'] },
      { key: 'skin', q: 'Skin type? / Loại da?', options: ['Oily / Dầu', 'Dry / Khô', 'Combination / Hỗn hợp'] },
      { key: 'severity', q: 'Current severity? / Mức độ hiện tại?', options: ['Mild / Nhẹ', 'Moderate / Trung bình', 'Severe / Nặng'] }
    ];

    const chatScript = [
      { type: 'sys', text: 'System: We reviewed your diagnosis. / Hệ thống: Đã ghi nhận thông tin chẩn đoán.' },
      { type: 'ask', text: 'How consistent is your routine? / Bạn duy trì quy trình đều không?', replies: ['Daily / Mỗi ngày', 'Most days / Hầu hết ngày', 'Irregular / Chưa đều'] },
      { type: 'ask', text: 'Any irritation this week? / Tuần này có kích ứng không?', replies: ['No / Không', 'Mild / Nhẹ', 'Yes / Có'] }
    ];

    const app = document.getElementById('app');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');

    function setStep(next) {
      step = Math.max(0, Math.min(10, next));
      progressLabel.textContent = `${step} / 10`;
      progressBar.style.width = `${step * 10}%`;
      render();
    }

    function btn(label, onClick, cls='bg-slate-900 text-white') {
      return `<button class="px-4 py-2 rounded-lg ${cls}" data-action="${onClick}">${label}</button>`;
    }

    function render() {
      if (step === 0) {
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-2">Start Guided Diagnosis</h2>
          <p class="text-slate-600 text-sm mb-5">You will move step-by-step through treatment logic. / Bạn sẽ đi theo từng bước trong logic điều trị.</p>
          ${btn('Start Journey', 'start')}
        `;
        bind(); return;
      }

      if (step >=1 && step <=3) {
        const q = quiz[step-1];
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">Diagnosis Quiz (${step}/3)</h2>
          <p class="text-slate-500 text-sm mb-4">One question at a time. / Mỗi lần một câu hỏi.</p>
          <div class="border rounded-lg p-4">
            <p class="font-medium mb-3">${q.q}</p>
            <div class="grid gap-2">
              ${q.options.map((o,i)=>`<button class="text-left border rounded-lg px-3 py-2 hover:bg-slate-50" data-action="answer-${i}">${o}</button>`).join('')}
            </div>
          </div>
        `;
        bind(); return;
      }

      if (step === 4) {
        const messages = chatScript.slice(0, state.chatIndex + 1);
        const current = chatScript[state.chatIndex];
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">Consultation Chat</h2>
          <p class="text-slate-500 text-sm mb-4">Quick replies only. / Phản hồi nhanh.</p>
          <div class="border rounded-lg p-3 bg-slate-50 h-56 overflow-auto mb-3 space-y-2" id="chatBox">
            ${messages.map(m=>`<div class="${m.type==='sys'?'bg-white border':'bg-white border'} rounded-lg p-2 text-sm">${m.text}</div>`).join('')}
            ${state.chatDone?'<div class="bg-slate-900 text-white rounded-lg p-2 text-sm w-fit ml-auto">Done / Xong</div>':''}
          </div>
          <div class="flex flex-wrap gap-2" id="replyArea">
            ${(!state.chatDone && current && current.replies) ? current.replies.map((r,i)=>`<button class="px-3 py-2 border rounded-lg" data-action="reply-${i}">${r}</button>`).join('') : ''}
          </div>
          <div class="mt-4">${state.chatDone ? btn('Continue', 'to5') : ''}</div>
        `;
        bind(); return;
      }

      if (step === 5) {
        const allOpened = Object.values(state.weekOpened).every(Boolean);
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">Treatment Plan Timeline</h2>
          <p class="text-slate-500 text-sm mb-4">Click each week to reveal details. / Bấm từng tuần để mở chi tiết.</p>
          <div class="grid md:grid-cols-3 gap-2 mb-3">
            ${[1,2,3].map(w=>`<button class="border rounded-lg p-3 text-left" data-action="week-${w}">Week ${w}<br><span class="text-xs text-slate-500">${state.weekOpened[w]?'Opened':'Tap to open'}</span></button>`).join('')}
          </div>
          <div id="weekDetails" class="space-y-2 mb-4">
            ${state.weekOpened[1]?'<div class="border rounded-lg p-2 text-sm">Week 1: Barrier reset to reduce irritation risk.</div>':''}
            ${state.weekOpened[2]?'<div class="border rounded-lg p-2 text-sm">Week 2: Active control starts for acne/pigment.</div>':''}
            ${state.weekOpened[3]?'<div class="border rounded-lg p-2 text-sm">Week 3: Stabilization and relapse prevention.</div>':''}
          </div>
          ${allOpened ? btn('Continue', 'to6') : '<p class="text-xs text-slate-500">Open all 3 weeks to continue.</p>'}
        `;
        bind(); return;
      }

      if (step === 6) {
        const allRoles = Object.values(state.roleOpened).every(Boolean);
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">Treatment Kit Roles</h2>
          <p class="text-slate-500 text-sm mb-4">Click each role to expand. / Bấm từng vai trò để mở rộng.</p>
          <div class="grid md:grid-cols-3 gap-2 mb-3">
            <button class="border rounded-lg p-3 text-left" data-action="role-cleanser">Cleanser</button>
            <button class="border rounded-lg p-3 text-left" data-action="role-serum">Serum</button>
            <button class="border rounded-lg p-3 text-left" data-action="role-moisturizer">Moisturizer</button>
          </div>
          <div class="space-y-2 mb-4 text-sm">
            ${state.roleOpened.cleanser?'<div class="border rounded-lg p-2">Role: gentle cleanse | When: Phase 1 AM/PM | Why: prevents pore clog and irritation buildup.</div>':''}
            ${state.roleOpened.serum?'<div class="border rounded-lg p-2">Role: active correction | When: Phase 2 at night | Why: targets root lesion/pigment behavior.</div>':''}
            ${state.roleOpened.moisturizer?'<div class="border rounded-lg p-2">Role: barrier support | When: all phases | Why: improves tolerance and adherence.</div>':''}
          </div>
          ${allRoles ? btn('Continue', 'to7') : '<p class="text-xs text-slate-500">Open all 3 product roles to continue.</p>'}
        `;
        bind(); return;
      }

      if (step === 7) {
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">What if I use my own products?</h2>
          <p class="text-slate-500 text-sm mb-4">Simulate wrong behavior. / Mô phỏng hành vi sai.</p>
          ${btn('What if I use my own products?', 'wrong', 'bg-amber-600 text-white')}
          ${state.warningShown ? '<div class="mt-4 border border-amber-300 bg-amber-50 rounded-lg p-3 text-sm">Warning: random substitution may cause irritation spikes, delayed response, and flare recurrence.</div>' : ''}
          ${state.warningShown ? `<div class="mt-4">${btn('Continue', 'to8')}</div>` : ''}
        `;
        bind(); return;
      }

      if (step === 8) {
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">Ready for Prescribed Flow</h2>
          <p class="text-slate-500 text-sm mb-4">One final confirmation before consultation form.</p>
          ${btn('Proceed to Final Form', 'to9')}
        `;
        bind(); return;
      }

      if (step === 9) {
        app.innerHTML = `
          <h2 class="text-xl font-semibold mb-1">Final Consultation Form</h2>
          <p class="text-slate-500 text-sm mb-4">Only appears at the end. / Chỉ xuất hiện ở cuối luồng.</p>
          <form id="finalForm" class="grid gap-3 max-w-md">
            <input name="name" required placeholder="Name" class="border rounded-lg px-3 py-2" />
            <input name="phone" required placeholder="Phone" class="border rounded-lg px-3 py-2" />
            <button class="px-4 py-2 rounded-lg bg-slate-900 text-white" type="submit">Submit</button>
          </form>
        `;
        document.getElementById('finalForm').addEventListener('submit', (e)=>{
          e.preventDefault();
          const fd = new FormData(e.target);
          state.name = fd.get('name');
          state.phone = fd.get('phone');
          setStep(10);
        });
        return;
      }

      if (step === 10) {
        app.innerHTML = `
          <h2 class="text-2xl font-semibold mb-2">Success: Journey Completed</h2>
          <p class="text-slate-600 text-sm mb-2">Patient: <strong>${state.name}</strong> | Phone: <strong>${state.phone}</strong></p>
          <p class="text-slate-500 text-sm mb-4">You completed a guided treatment system, not product browsing.</p>
          ${btn('Restart Demo', 'restart', 'border border-slate-300 bg-white')}
        `;
        bind(); return;
      }
    }

    function bind() {
      app.querySelectorAll('[data-action]').forEach(el=>{
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');

          if (action === 'start') return setStep(1);

          if (action.startsWith('answer-')) {
            const q = quiz[step-1];
            state.answers[q.key] = q.options[Number(action.split('-')[1])];
            return setStep(step + 1);
          }

          if (action.startsWith('reply-')) {
            if (state.chatIndex < chatScript.length - 1) {
              state.chatIndex += 1;
            } else {
              state.chatDone = true;
            }
            if (state.chatIndex === chatScript.length - 1) state.chatDone = true;
            return render();
          }

          if (action === 'to5') return setStep(5);
          if (action.startsWith('week-')) {
            const w = Number(action.split('-')[1]);
            state.weekOpened[w] = !state.weekOpened[w];
            return render();
          }
          if (action === 'to6') return setStep(6);

          if (action.startsWith('role-')) {
            const role = action.split('-')[1];
            state.roleOpened[role] = !state.roleOpened[role];
            return render();
          }
          if (action === 'to7') return setStep(7);

          if (action === 'wrong') {
            state.warningShown = true;
            return render();
          }
          if (action === 'to8') return setStep(8);
          if (action === 'to9') return setStep(9);
          if (action === 'restart') location.reload();
        });
      });
    }

    // chat bootstrap requires one click on each quick reply step and then continue
    setStep(0);
  </script>
</body>
</html>
