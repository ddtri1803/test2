<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dermatology Guided Conversion Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-4xl mx-auto px-4 py-6">
    <section class="panel mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-semibold">Guided Treatment Journey</h1>
          <p class="text-sm text-slate-500">Diagnosis → Plan → Kit → Consultation → Conversion</p>
        </div>
        <span class="chip">Step <span id="stepLabel">0</span>/10</span>
      </div>
      <div class="mt-3 h-2 bg-slate-100 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-slate-900 transition-all duration-300" style="width:0%"></div>
      </div>
    </section>

    <section id="view" class="panel min-h-[420px]"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
